name: kalshi-incentive-paper
on:
  schedule:
    - cron: '41 * * * *'   # hourly at :41 (off-peak minute; GH cron drifts)
  workflow_dispatch: {}

concurrency:
  group: kalshi-incentive
  cancel-in-progress: false   # queue, never kill a run mid-write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      # The shadow book. Always runs, never touches the account, no credentials.
      - name: tick the paper book
        run: python3 scripts/kalshi_incentive_paper.py --capital 257 --slots 5 --sample 250

      # The real book. The script's own gate decides whether anything is sent:
      # it needs KALSHI_LIVE=1, state/INCENTIVE_LIVE present, no kill switch,
      # and credentials. Absent any of those this is a dry run that still
      # reconciles and reports, which is what we want on every hourly pass.
      #
      # SIZE IS THE CANARY SIZE, DELIBERATELY. The runbook's first real
      # allocation is ~$40 across two long-duration markets, not $257 across
      # eight -- nobody has yet seen Kalshi credit a single reward from this
      # program, so the first money buys that one fact and nothing else.
      # Because --live is already passed here, whatever sits on this line is
      # what the first armed pass sends; at $257/8 the canary would be skipped
      # by accident. Raising it is a commit, so git blame shows who did it,
      # and it should not happen before a credited reward is observed.
      - name: quote / reconcile the incentive book
        env:
          KALSHI_PROD_KEY_ID: ${{ secrets.KALSHI_PROD_KEY_ID }}
          KALSHI_PROD_PRIVATE_KEY: ${{ secrets.KALSHI_PROD_PRIVATE_KEY }}
          KALSHI_LIVE: ${{ secrets.KALSHI_LIVE }}
        run: |
          pip install -q requests cryptography
          python3 scripts/kalshi_incentive_quote.py \
            --capital 40 --max-per-market 20 --markets 2 --sample 400 --live

      - name: commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/kalshi_incentive_paper.json
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "kalshi: incentive tick $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push race, retry $i"; sleep $((2**i))
          done
          exit 1
