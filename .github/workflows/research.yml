name: research-desk-nightly
# Nightly data refresh + re-validation of the live strategy on updated data.
# Produces state/research_report.json for the risk-committee agent session.

on:
  schedule:
    - cron: '23 6 * * *'   # daily 06:23 UTC
  workflow_dispatch: {}

concurrency:
  group: research-desk   # own group: the hourly desk must not evict queued nightly runs
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update crypto candle data
        run: |
          set -euo pipefail
          python scripts/update_data.py
      - name: Update equity panel
        # Deliberately still non-fatal HERE: a flaky upstream should not take
        # the crypto revalidation and the report commit down with it. The run
        # is failed at the end instead, by "Assert equity panel advanced", so
        # everything that can still succeed does — and the job goes red on the
        # thing that actually matters rather than on the fetch attempt.
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/update_equities.py
      - name: Re-validate live strategy (walk-forward, all data)
        run: |
          set -euo pipefail
          STRAT=$(python -c "import json;print(json.load(open('config/live.json'))['strategy'])")
          PARAMS=$(python -c "import json;print(json.dumps(json.load(open('config/live.json'))['params']))")
          python -m quantfirm.cli walkforward --strategy "$STRAT" --params "$PARAMS" --symbol BTCUSDT --split all > state/research_report.json
          python -m json.tool state/research_report.json   # reject corrupt reports
      - name: Commit data + report
        run: |
          set -euo pipefail
          git config user.name "vinilpolepalli"
          git config user.email "105608101+vinilpolepalli@users.noreply.github.com"
          git add data/*.csv.gz state/research_report.json
          git add data/equities/*.csv.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: nightly data refresh + revalidation"
          pushed=0
          for i in 1 2 3 4; do
            if git push; then pushed=1; break; fi
            git pull --rebase || true
            sleep $((i*2))
          done
          [ "$pushed" = "1" ]

      # Last, and always — including when the fetch above swallowed its own
      # failure. Four consecutive runs reported success while data/equities sat
      # five sessions behind and the desk had quietly stopped rebalancing; a
      # skipped refresh was indistinguishable from a working one. This is the
      # step that makes that visible. It shares its definition of "stale" with
      # plan()'s trading guard, so a green run means the desk can trade.
      - name: Assert equity panel advanced
        if: always()
        run: |
          set -euo pipefail
          python scripts/check_panel_fresh.py
