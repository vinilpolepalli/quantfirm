name: research-desk-nightly
# Nightly data refresh + re-validation of the live strategy on updated data.
# Produces state/research_report.json for the risk-committee agent session.

on:
  schedule:
    - cron: '23 6 * * *'   # daily 06:23 UTC
  workflow_dispatch: {}

concurrency:
  group: research-desk   # own group: the hourly desk must not evict queued nightly runs
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update crypto candle data
        # Per-step timeouts everywhere: this job was cancelled for five nights
        # because ONE step with a rate-limited upstream absorbed the whole
        # 30-minute job budget and took the commit step down with it. A step
        # that hangs should now fail as itself, loudly and early.
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python scripts/update_data.py
      # The equity panel is deliberately NOT fetched here.
      #
      # Yahoo answers 429 to GitHub's egress, and update_equities.py responds by
      # pacing 227 symbols through retries and 90s cool-offs. Measured: 17
      # minutes without writing a single file. Against this job's 30-minute
      # timeout that does not merely fail — it consumes the budget, the job is
      # cancelled mid-flight, and the steps AFTER it never run. That is why
      # state/research_report.json sat unchanged from 2026-08-07 while the
      # workflow kept reporting success: the report was being computed and then
      # thrown away with the cancelled job.
      #
      # The panel is now fed by the equity desk session, which can reach the
      # broker's API (scripts/import_bars.py). Freshness is enforced there and
      # by plan()'s own stale-panel guard, which refuses to trade on an old
      # view. Asserting it *here* would also be wrong: at 06:23 UTC the desk has
      # not yet imported the previous session, so the panel is one session
      # behind by design and a check in this slot would fail every night.
      - name: Re-validate live strategy (walk-forward, all data)
        timeout-minutes: 12
        run: |
          set -euo pipefail
          STRAT=$(python -c "import json;print(json.load(open('config/live.json'))['strategy'])")
          PARAMS=$(python -c "import json;print(json.dumps(json.load(open('config/live.json'))['params']))")
          python -m quantfirm.cli walkforward --strategy "$STRAT" --params "$PARAMS" --symbol BTCUSDT --split all > state/research_report.json
          python -m json.tool state/research_report.json   # reject corrupt reports
      - name: Commit data + report
        timeout-minutes: 5
        run: |
          set -euo pipefail
          git config user.name "vinilpolepalli"
          git config user.email "105608101+vinilpolepalli@users.noreply.github.com"
          git add data/*.csv.gz state/research_report.json
          git add data/equities/*.csv.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: nightly data refresh + revalidation"
          pushed=0
          for i in 1 2 3 4; do
            if git push; then pushed=1; break; fi
            git pull --rebase || true
            sleep $((i*2))
          done
          [ "$pushed" = "1" ]

      # Last, and always. This job's deliverable is the report, and a report the
      # risk committee cannot trust is the failure worth going red for: stale
      # candles behind it, a strategy that no longer matches what is on watch,
      # a walk-forward that produced no folds, or a bar count that went
      # backwards. Runs green for five days while shipping nothing taught us
      # that "the steps exited 0" is not the same as "the artifact is good".
      - name: Assert the report is usable
        if: always()
        run: |
          set -euo pipefail
          python scripts/check_report.py
