name: execution-desk
# The firm's 24/7 execution desk: one idempotent engine run per hour.
# Requires repo secrets RH_API_KEY and RH_PRIVATE_KEY_B64.

on:
  schedule:
    - cron: '7 * * * *'   # hourly at :07 (off-peak minute; GH cron can drift)
  workflow_dispatch: {}

concurrency:
  group: trading-engine
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash   # explicit bash => -eo pipefail; a piped engine crash must fail the run

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # only reviewed main code ever touches the trading secrets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run trading engine
        env:
          RH_API_KEY: ${{ secrets.RH_API_KEY }}
          RH_PRIVATE_KEY_B64: ${{ secrets.RH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          python -m quantfirm.live.engine > run_result.json
          cat run_result.json
          python -m json.tool run_result.json > /dev/null   # engine stdout must be valid JSON
      - name: Commit state
        run: |
          set -euo pipefail
          git config user.name "quantfirm-bot"
          git config user.email "bot@users.noreply.github.com"
          # each file may legitimately not exist (e.g. desk disabled -> no
          # state file yet); a bare [ -f ] && under set -e kills the job
          for f in state/live_state.json state/trade_log.csv state/KILL_SWITCH; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no state change"; exit 0
          fi
          git commit -m "state: engine run $(date -u +%FT%H:%M)"
          pushed=0
          for i in 1 2 3 4; do
            if git push; then pushed=1; break; fi
            git pull --rebase || true
            sleep $((i*2))
          done
          # a stranded state commit (or KILL_SWITCH) must fail loudly, never silently
          [ "$pushed" = "1" ]
