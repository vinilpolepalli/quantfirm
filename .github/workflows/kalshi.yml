name: kalshi-15m-desk
# Backstop tick. GitHub-hosted minutes cannot poll every 2 seconds (that
# would blow the 2,000 min/month budget). Four times an hour this job
# wakes around minute 5 of each 15-minute window (desk_book: commodities
# ≥60¢ until close, BTC ≥72¢ skipping the last 2 minutes), writes the heartbeat, and exits.
#
# Primary 24/7 loop: scripts/kalshi_paper_loop.sh on a persistent host
# (this cloud box, a VPS, or a Cursor 15-minute timer — see
# docs/KALSHI_ROUTINE.md). Scheduled workflows run only on main, so this
# job starts after the desk PR merges.
#
# Secrets (optional; shadow paper works without them):
#   KALSHI_PROD_KEY_ID, KALSHI_PROD_PRIVATE_KEY
#   KALSHI_LIVE=1  — only then are real orders sent. Leave unset.

on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch: {}

concurrency:
  group: kalshi-desk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  desk:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tick the diversified 15m book
        env:
          KALSHI_PROD_KEY_ID: ${{ secrets.KALSHI_PROD_KEY_ID }}
          KALSHI_PROD_PRIVATE_KEY: ${{ secrets.KALSHI_PROD_PRIVATE_KEY }}
          KALSHI_LIVE: ${{ secrets.KALSHI_LIVE }}
        run: |
          set -euo pipefail
          python -m quantfirm.kalshi.cli status || true
          python -m quantfirm.kalshi.cli agent \
            --minutes 1.5 --poll 2 --no-demo --no-maker --log-decisions \
            --strategy desk_book --bankroll 250 \
            --metals gold,silver,copper,wti,natgas,btc \
            ${KALSHI_LIVE:+--live}
          python -m quantfirm.kalshi.cli heartbeat || true
      - name: Commit paper heartbeat
        run: |
          set -euo pipefail
          git config user.name "vinilpolepalli"
          git config user.email "105608101+vinilpolepalli@users.noreply.github.com"
          for f in state/kalshi_desk_status.json state/kalshi_paper_state.json \
                   state/kalshi_paper_trades.csv state/kalshi_checkin_mark.json \
                   research/kalshi_backtest.md research/kalshi_tournament.md; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no state change"; exit 0
          fi
          git commit -m "kalshi: desk tick $(date -u +%FT%H:%M)"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase || true
            sleep $((i*2))
          done
          exit 1
